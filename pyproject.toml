[build-system]
requires = []
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "portable-execution-orchestrator"
version = "1.1.0"
description = "Offline execution orchestrator runtime"
requires-python = ">=3.10"

dependencies = [
  "minio>=7,<8",
  "psycopg2-binary>=2.9,<3",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["images", "data", "logs", ".runtime-secrets"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
