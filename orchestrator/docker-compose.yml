services:
  orchestrator-gateway:
    image: portable/orchestrator-gateway:1.0.0
    restart: unless-stopped
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_API_KEY_FILE: /run/secrets/gateway_api_key
      REGISTRY_FILE: /bundle/agent-registry/registration/agents.json
      N8N_INTERNAL_URL: http://n8n:5678
      N8N_CONTAINER: n8n
      N8N_POSTGRES_CONTAINER: postgres
      ORCHESTRATOR_BASE_URL: http://orchestrator-agent:8020
    secrets: [gateway_api_key]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:${GATEWAY_PORT:-27880}:8080"]
    networks: [registry_internal]
    depends_on:
      planning-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/python3.10", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  planning-agent:
    image: portable/planning-agent-stub:1.0.0
    restart: unless-stopped
    environment:
      PLANNING_AGENT_STATE_FILE: /state/planning-agent-last.json
      PLANNING_AGENT_MAX_REQUEST_BYTES: ${PLANNING_AGENT_MAX_REQUEST_BYTES:-1048576}
      PLANNING_AGENT_HMAC_REQUIRED: ${PLANNING_AGENT_HMAC_REQUIRED:-false}
      PLANNING_AGENT_DEV_HMAC_BYPASS: ${PLANNING_AGENT_DEV_HMAC_BYPASS:-true}
    volumes:
      - planning-agent-state:/state
    ports: ["127.0.0.1:${PLANNING_AGENT_PORT:-18000}:18000"]
    networks: [registry_internal]
    healthcheck:
      test: ["CMD", "/usr/local/bin/python3.10", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  orchestrator-agent:
    image: orchestrator-agent-standalone:1.1.0
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: none
    restart: unless-stopped
    environment:
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_API_KEY_FILE: /run/secrets/n8n_api_key
      N8N_WEBHOOK_AUTH_HEADER: ${N8N_WEBHOOK_AUTH_HEADER:-X-Orchestrator-Webhook}
      N8N_WEBHOOK_CREDENTIAL_REF: ${N8N_WEBHOOK_CREDENTIAL_REF:?N8N_WEBHOOK_CREDENTIAL_REF is required}
      N8N_WEBHOOK_PATH_SECRET_FILE: /run/secrets/n8n_webhook_path_secret
      N8N_WEBHOOK_AUTH_VALUE_FILE: /run/secrets/n8n_webhook_auth_value
      ORCHESTRATOR_PLANNING_AGENT_BASE_URL: ${ORCHESTRATOR_PLANNING_AGENT_BASE_URL:-http://planning-agent:18000}
      ORCHESTRATOR_WORKFLOW_LLM_BASE_URL: ${ORCHESTRATOR_WORKFLOW_LLM_BASE_URL:?workflow LLM URL is required}
      ORCHESTRATOR_WORKFLOW_LLM_API_KEY_FILE: /run/secrets/workflow_llm_api_key
      ORCHESTRATOR_WORKFLOW_LLM_MODEL: ${ORCHESTRATOR_WORKFLOW_LLM_MODEL:-deepseek-v4-flash}
      ORCHESTRATOR_WORKFLOW_LLM_TIMEOUT_SECONDS: ${ORCHESTRATOR_WORKFLOW_LLM_TIMEOUT_SECONDS:-120}
      ORCHESTRATOR_WORKFLOW_LLM_NETWORK_ATTEMPTS: ${ORCHESTRATOR_WORKFLOW_LLM_NETWORK_ATTEMPTS:-3}
      ORCHESTRATOR_REASONER_DEADLINE_SECONDS: ${ORCHESTRATOR_REASONER_DEADLINE_SECONDS:-300}
      ORCHESTRATOR_PLANNING_AGENT_HMAC_SECRET_FILE: /run/secrets/planning_agent_hmac
      ORCHESTRATOR_N8N_HMAC_SECRET_FILE: /run/secrets/n8n_hmac
      ORCHESTRATOR_DATABASE_PATH: /var/lib/orchestrator/orchestrator.sqlite3
      ORCHESTRATOR_POSTGRES_DSN: ${ORCHESTRATOR_POSTGRES_DSN:-}
      ORCHESTRATOR_POSTGRES_SCHEMA: ${ORCHESTRATOR_POSTGRES_SCHEMA:-orchestrator}
      ORCHESTRATOR_REDIS_URL: ${ORCHESTRATOR_REDIS_URL:-}
      ORCHESTRATOR_REDIS_REQUIRED: ${ORCHESTRATOR_REDIS_REQUIRED:-false}
      ORCHESTRATOR_V2_ENABLED: ${ORCHESTRATOR_V2_ENABLED:-false}
      ORCHESTRATOR_V2_AGENT_ALLOWED_HOSTS: ${ORCHESTRATOR_V2_AGENT_ALLOWED_HOSTS:-}
      ORCHESTRATOR_V2_ALLOWED_PRIVATE_CIDRS: ${ORCHESTRATOR_V2_ALLOWED_PRIVATE_CIDRS:-}
      N8N_GATEWAY_CREDENTIAL_REF: ${N8N_GATEWAY_CREDENTIAL_REF:-orchestrator-gateway}
    secrets: [n8n_api_key, planning_agent_hmac, n8n_hmac, n8n_webhook_path_secret, n8n_webhook_auth_value, workflow_llm_api_key]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - orchestrator-data:/var/lib/orchestrator
    ports: ["127.0.0.1:${ORCHESTRATOR_PORT:-18020}:8020"]
    networks: [registry_internal]
    depends_on:
      planning-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/python3.10", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  orchestrator-data:
  planning-agent-state:

networks:
  registry_internal:
    external: true
    name: ${REGISTRY_NETWORK_NAME:-orchestrator_shared}

secrets:
  gateway_api_key:
    file: "${GATEWAY_API_KEY_FILE:?GATEWAY_API_KEY_FILE is required}"
  n8n_api_key:
    file: "${N8N_API_KEY_FILE:?N8N_API_KEY_FILE is required}"
  planning_agent_hmac:
    file: "${ORCHESTRATOR_PLANNING_AGENT_HMAC_SECRET_FILE:?planning secret file is required}"
  n8n_hmac:
    file: "${ORCHESTRATOR_N8N_HMAC_SECRET_FILE:?n8n secret file is required}"
  n8n_webhook_path_secret:
    file: "${N8N_WEBHOOK_PATH_SECRET_FILE:?webhook path secret file is required}"
  n8n_webhook_auth_value:
    file: "${N8N_WEBHOOK_AUTH_VALUE_FILE:?webhook auth value file is required}"
  workflow_llm_api_key:
    file: "${ORCHESTRATOR_WORKFLOW_LLM_API_KEY_FILE:?workflow LLM API key file is required}"
