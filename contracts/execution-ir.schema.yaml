$schema: https://json-schema.org/draft/2020-12/schema
title: ExecutionIR
type: object
additionalProperties: false
required: [ir_version, workflow_family_id, workflow_version, task_id, registry_snapshot_id, nodes, edges, completion_criteria]
properties:
  ir_version: {type: string}
  workflow_family_id: {type: string, minLength: 1}
  workflow_version: {type: integer, minimum: 1}
  task_id: {type: string, minLength: 1}
  registry_snapshot_id: {type: string, minLength: 1}
  context_view_id: {type: [string, 'null']}
  nodes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [node_id, name, agent_binding, depends_on, input_contract, output_contract, completion_criteria, artifact_policy]
      properties:
        node_id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        type: {type: string, enum: [invoke_agent, load_artifact, store_artifact, evaluate, checkpoint, decision, join, wait, end]}
        agent_binding:
          type: object
          description: Must resolve exclusively from Registry Snapshot; credential_ref only, never secret.
          additionalProperties: true
        depends_on: {type: array, items: {type: string}, uniqueItems: true}
        input_contract: {type: object}
        output_contract: {type: object}
        completion_criteria: {type: object}
        artifact_policy: {type: object}
        checkpoint_policy: {type: object}
        retry_policy: {type: object}
        monitor_policy: {type: object}
  edges:
    type: array
    items:
      type: object
      required: [from, to]
      properties:
        from: {type: string}
        to: {type: string}
  artifacts: {type: array, items: {type: object}}
  checkpoints: {type: array, items: {type: object}}
  recovery:
    type: object
    properties:
      resume_root: {type: [string, 'null']}
      reused_nodes: {type: array, items: {type: string}}
      invalidated_nodes: {type: array, items: {type: string}}
  completion_criteria: {type: object}
